spring.application.name=pokedex-backend
server.port=18084

# Credenciais NUNCA ficam no repositório: use a variável de ambiente MONGODB_URI
# ou crie o arquivo backend/.env (ignorado pelo git) com a linha MONGODB_URI=...
spring.config.import=optional:file:.env[.properties]
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/pokedex}
# Nome do banco (vale mesmo que a URI não traga o "/pokedex" antes do "?")
spring.data.mongodb.database=${MONGODB_DATABASE:pokedex}

# Origens do frontend autorizadas a chamar a API (separadas por vírgula)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Popula as coleções a partir do Script_Pokedex.sql quando estiverem vazias
app.seed.enabled=true
app.seed.script=classpath:Script_Pokedex.sql

# Administrador criado na inicialização (opcional). Se ADMIN_PASSWORD estiver vazia, nenhum é criado;
# qualquer pessoa pode se cadastrar em POST /api/auth/register.
app.security.username=${ADMIN_USER:admin}
app.security.password=${ADMIN_PASSWORD:}

# Token JWT (HMAC-SHA256). JWT_SECRET precisa ter pelo menos 32 caracteres e não vai para o GitHub.
# Se estiver vazio, um segredo temporário é gerado a cada inicialização (os logins caem ao reiniciar).
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

# Upload de imagens: cada arquivo até 2 MB (o limite também é conferido no PokemonImageService)
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# Cria o índice único de "username" na coleção users
spring.data.mongodb.auto-index-creation=true
